name: Build RD16 firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync subversion swig time unzip \
            zlib1g-dev file wget bc libelf-dev cpio aria2

      - name: Clone RomikB source
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-rd15 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          echo "=== vendor_scripts ==="
          ls -la vendor_scripts/

      - name: Copy myhelper into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Fix Makefile tabs
        run: |
          set -e
          FILE="openwrt-src/package/myhelper/Makefile"
          sed -i 's/^    /\t/' "$FILE"
          grep -nP '^\t' "$FILE" | head -10 | cat -A
          if grep -qP '^ ' "$FILE"; then
            echo "WARNING: leading spaces remain"
          else
            echo "OK: no leading spaces"
          fi

      - name: Prepare config for RD16
        run: |
          set -e
          cd openwrt-src
          chmod +x vendor_scripts/*.sh vendor_scripts/*.py 2>/dev/null || true
          sh vendor_scripts/prepare_config.sh rd16
          echo "=== Target check ==="
          grep -E '^CONFIG_TARGET' .config | head -20
          
      - name: Remove QSDK Wi-Fi CLI packages from RD16 target
        run: |
          set -e
          cd openwrt-src

          # These packages need hostapd-2022-09-19.tar.bz2, gone from all mirrors.
          # Remove from DEFAULT_PACKAGES so make defconfig won't re-add them.
          TARGET_MK="target/linux/ipq53xx/rd16/target.mk"

          echo "=== BEFORE ==="
          grep -n "qca-hostapd-cli\|qca-wpa-cli\|qca-wpa-supplicant-vendor\|qca-hostap-vendor" "$TARGET_MK" || true

          sed -i 's/qca-hostapd-cli//g; s/qca-wpa-cli//g; s/qca-wpa-supplicant-vendor//g; s/qca-hostap-vendor//g' "$TARGET_MK"

          echo "=== AFTER ==="
          grep -n "qca-hostapd-cli\|qca-wpa-cli\|qca-wpa-supplicant-vendor\|qca-hostap-vendor" "$TARGET_MK" \
          && echo "!!! still present !!!" \
          || echo "OK: all removed from DEFAULT_PACKAGES"

      - name: Prepare feeds
        run: |
          set -e
          cd openwrt-src
          sh vendor_scripts/prepare_feed.sh || true
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable myhelper + all runtime deps (embedded into firmware)
        run: |
          set -e
          cd openwrt-src

          # Our package
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
 
          # Userspace tools needed at runtime (exec'd by the daemon)
          echo "CONFIG_PACKAGE_nftables=y"       >> .config
          echo "CONFIG_PACKAGE_tc=y"             >> .config
          echo "CONFIG_PACKAGE_ethtool=y"        >> .config

          # Kernel modules for CAKE shaping and IFB ingress
          echo "CONFIG_PACKAGE_kmod-sched-cake=y" >> .config
          echo "CONFIG_PACKAGE_kmod-ifb=y"        >> .config
          echo "CONFIG_PACKAGE_kmod-nft-core=y"   >> .config

          # BBR congestion control (needed for the BBR toggle)
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"    >> .config

          make defconfig

          echo "=== Verify embedded packages ==="
          grep -E '^CONFIG_PACKAGE_(myhelper|nftables|tc|kmod-sched-cake|kmod-ifb|kmod-tcp-bbr|kmod-nft-core)=' .config

  
          grep -E '^CONFIG_PACKAGE_myhelper' .config || echo "!!! NOT IN CONFIG !!!"
          grep -E '^CONFIG_TARGET_arch=' .config || true
          grep -E '^CONFIG_TARGET_ipq53xx' .config | head -10

      - name: Build kmod toolchain (GCC 7.5.0 for kernel)
        run: |
          set -e
          cd openwrt-src
          bash vendor_scripts/build_kmod_toolchain.sh

      - name: Build full firmware (this takes 3-5 hours)
        run: |
          set -e
          cd openwrt-src
          # First try parallel build; fallback to serial if it OOMs
          make -j$(nproc) V=s || {
            echo "=== Parallel build failed, retrying with -j1 ==="
            make -j1 V=s
          }

      - name: Collect firmware images
        run: |
          set -e
          mkdir -p output

          # Firmware images (flashable)
          find openwrt-src/bin/targets -name '*sysupgrade*.bin' -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.bin'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.ubi'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*initramfs*'    -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*.itb'          -exec cp -v {} output/ \; || true

          # myhelper .ipk as fallback (if user wants to install later)
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true

          echo "=== output contents ==="
          ls -la output/

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: no images produced"
            find openwrt-src/bin/targets -maxdepth 4 -type f | head -40
            exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rd16-firmware
          path: output/*
          if-no-files-found: error
          retention-days: 30
