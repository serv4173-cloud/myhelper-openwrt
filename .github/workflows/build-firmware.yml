name: Build RD16 firmware (prebuild + verify)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 400
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools python3-pip rsync subversion swig time \
            unzip zlib1g-dev file wget bc libelf-dev cpio aria2 squashfs-tools
          pip install --quiet ubi_reader pyelftools capstone

      - name: Verify tools
        run: |
          echo "=== Tool versions ==="
          which ubireader_extract_images
          which unsquashfs
          ubireader_extract_images --version 2>&1 | head -3 || true

      - name: Clone RomikB source
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-be3600 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          echo "=== vendor_scripts ==="
          ls -la vendor_scripts/
          echo "=== target/linux/ipq53xx ==="
          ls -la target/linux/ipq53xx/

      - name: Download stock RD16 firmware
        run: |
          set -e
          cd openwrt-src
          STOCK_URL="https://github.com/serv4173-cloud/myhelper-openwrt/releases/download/stock-1.0.31/miwifi_rd16_firmware_87da2_1.0.31.bin"
          echo "Downloading: $STOCK_URL"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o miwifi_rd16_firmware_87da2_1.0.31.bin "$STOCK_URL"
          ls -la miwifi_rd16_firmware_87da2_1.0.31.bin

      - name: Copy myhelper into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Fix Makefile tabs
        run: |
          set -e
          FILE="openwrt-src/package/myhelper/Makefile"
          sed -i 's/^    /\t/' "$FILE"
          grep -nP '^\t' "$FILE" | head -10 | cat -A

      - name: Extract vendor feed + kernel from stock firmware
        run: |
          set -e
          cd openwrt-src
          chmod +x vendor_scripts/*.sh
          
          echo "=== Running prepare_feed.sh rd16 ==="
          sh vendor_scripts/prepare_feed.sh rd16

          echo "=== Checking where the kernel was extracted ==="
          # Ищем файл kernel везде в target/linux
          KERNEL_PATH=$(find target/linux -name 'kernel' | head -n 1)
          
          if [ -z "$KERNEL_PATH" ]; then
            echo "ERROR: prepare_feed.sh did not produce any kernel file"
            echo "=== Dumping target/linux/ipq53xx/ structure ==="
            ls -la target/linux/ipq53xx/ || true
            exit 1
          fi
          
          echo "Found kernel at: $KERNEL_PATH"
          
          # Создаем нужную папку и копируем ядро туда, где его ждет сборка
          mkdir -p target/linux/ipq53xx/rd16
          cp -f "$KERNEL_PATH" target/linux/ipq53xx/rd16/kernel
          
          echo "=== Successfully prepared kernel for rd16 ==="
          ls -la target/linux/ipq53xx/rd16/kernel

      - name: Prepare config for RD16 (prebuild, no QSDK)
        run: |
          set -e
          cd openwrt-src
          echo "=== Running prepare_config.sh rd16 ==="
          sh vendor_scripts/prepare_config.sh rd16

          # Drop QSDK profiles (they cause network failure on RD16)
          sed -i '/TARGET_DEVICE_ipq53xx_rd16_DEVICE_xiaomi-rd16-qsdk/d' .config
          sed -i '/TARGET_DEVICE_ipq53xx_rd16_DEVICE_xiaomi-rd16-qsdk-podkop/d' .config

          make defconfig

          echo "=== Active RD16 devices ==="
          grep -E '^CONFIG_TARGET_DEVICE_ipq53xx_rd16' .config || echo "!!! NO RD16 DEVICES !!!"

      - name: Stub out broken QSDK CLI packages
        run: |
          set -e
          cd openwrt-src

          # These 3 packages use hostapd-2022-09-19.tar.bz2 (404 on all mirrors)
          # and lack libnl/dbus deps. Replace with empty stubs so dependents build.
          for pkg in qca-hostapd-cli qca-wpa-cli qca-wpa-supplicant-vendor; do
            PKG_DIR="package/network/utils/$pkg"
            if [ ! -d "$PKG_DIR" ]; then
              echo "Not present: $PKG_DIR"
              continue
            fi
            echo "=== Stubbing: $pkg ==="
            {
             echo "include \$(TOPDIR)/rules.mk"
             echo "PKG_NAME:=$pkg"
             echo "PKG_VERSION:=stub"
             echo "PKG_RELEASE:=1"
             echo "include \$(INCLUDE_DIR)/package.mk"
             echo ""
             echo "define Package/$pkg"
             echo "  SECTION:=net"
             echo "  CATEGORY:=Network"
             echo "  SUBMENU:=Wireless"
             echo "  TITLE:=STUB $pkg"
             echo "  DEPENDS:=@TARGET_ipq53xx"
             echo "endef"
             echo ""
             echo "define Package/$pkg/description"
             echo "  Stubbed: original source unavailable on OpenWrt mirrors."
             echo "endef"
             echo ""
             echo "define Build/Prepare"
             echo "endef"
             echo "define Build/Configure"
             echo "endef"
             echo "define Build/Compile"
             echo "endef"
             echo ""
             echo "define Package/$pkg/install"
             echo "  \$(INSTALL_DIR) \$(1)/usr/sbin"
             echo "endef"
             echo ""
             echo "\$(eval \$(call BuildPackage,$pkg))"
            } > "$PKG_DIR/Makefile"
            echo "Stubbed: $PKG_DIR/Makefile"
            head -5 "$PKG_DIR/Makefile"
          done

      - name: Remove QSDK packages from target.mk
        run: |
          set -e
          cd openwrt-src
          TARGET_MK="target/linux/ipq53xx/rd16/target.mk"

          # Remove ONLY failing packages — KEEP Wi-Fi drivers (kmod-qca-wifi-*,
          # qca-wifi-scripts, wififw_mount_script, kmod-qca-nss-*).
          for pkg in \
            qca-hostapd-cli qca-wpa-cli qca-wpa-supplicant-vendor \
            qca-hostap-vendor qca-cfg80211tool-vendor qca-cnss-daemon-vendor \
            qca-firmware-vendor qca-ssdk-shell kmod-qca-nss-ecm-wifi-plugin \
            yt-9215s-client ; do
            sed -i "s|${pkg}||g" "$TARGET_MK"
          done

          echo "=== After removal ==="
          grep -E "qca-|wififw|kmod-qca" "$TARGET_MK" || echo "no QSDK CLI references left"

      - name: Feeds update + patch + install
        run: |
          set -e
          cd openwrt-src
          ./scripts/feeds update -a
          if [ -f vendor_scripts/patch_feeds.py ]; then
            python3 vendor_scripts/patch_feeds.py || echo "patch_feeds.py returned non-zero, continuing"
          fi
          ./scripts/feeds install -a

      - name: Enable myhelper + runtime deps
        run: |
          set -e
          cd openwrt-src
          echo "CONFIG_PACKAGE_myhelper=y"             >> .config
          echo "CONFIG_PACKAGE_nftables=y"            >> .config
          echo "CONFIG_PACKAGE_tc=y"                  >> .config
          echo "CONFIG_PACKAGE_ethtool=y"             >> .config
          echo "CONFIG_PACKAGE_kmod-sched-cake=y"     >> .config
          echo "CONFIG_PACKAGE_kmod-ifb=y"            >> .config
          echo "CONFIG_PACKAGE_kmod-nft-core=y"       >> .config
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"        >> .config
          echo "CONFIG_PACKAGE_kmod-net-sched=y"      >> .config
          echo "CONFIG_PACKAGE_kmod-ifb=y"            >> .config
          echo "CONFIG_PACKAGE_kmod-sched-hfsc=y"     >> .config
          echo "CONFIG_PACKAGE_kmod-act-mirred=y"     >> .config
          echo "CONFIG_PACKAGE_kmod-act-gact=y"       >> .config
          echo "CONFIG_PACKAGE_kmod-sch-ingress=y"    >> .config
          echo "CONFIG_PACKAGE_zapret=y"               >> .config
          echo "CONFIG_PACKAGE_luci-app-zapret=y"      >> .config
          make defconfig
          echo "=== Verify enabled packages ==="
          grep -E '^CONFIG_PACKAGE_(myhelper|nftables|tc|kmod-sched-cake|kmod-ifb|kmod-tcp-bbr|kmod-nft-core)=y' .config || true

      - name: Build kmod toolchain (GCC 7.5.0)
        run: |
          set -e
          cd openwrt-src
          bash vendor_scripts/build_kmod_toolchain.sh

      - name: Build full firmware
        run: |
          set -e
          cd openwrt-src
          make -j$(nproc) V=s || make -j1 V=s

      - name: Verify compiled kernel + DTB (Part 3)
        run: |
          set -e
          cd openwrt-src

          echo "=== Locating compiled kernel ==="
          KERNEL=$(find build_dir -name 'Image' -path '*linux-ipq53xx*rd16*' | head -1)
          if [ -z "$KERNEL" ]; then
            KERNEL=$(find build_dir -name 'Image' -path '*linux-ipq53xx*' | head -1)
          fi
          echo "Kernel path: $KERNEL"
          if [ -f "$KERNEL" ]; then
            echo "Kernel size: $(stat -c%s $KERNEL) bytes"
            if strings "$KERNEL" | grep -q "ipq53"; then
              echo "OK: kernel contains ipq53 references"
            fi
            if strings "$KERNEL" | grep -q "qca-nss"; then
              echo "OK: kernel contains NSS references"
            fi
          else
            echo "WARNING: kernel Image not found in build_dir"
          fi

          echo "=== Locating compiled DTB ==="
          DTB=$(find build_dir -name 'ipq5332-rd16.dtb' | head -1)
          echo "DTB path: $DTB"
          if [ -f "$DTB" ]; then
            echo "DTB size: $(stat -c%s $DTB) bytes"
            xxd "$DTB" | head -2
          else
            echo "WARNING: ipq5332-rd16.dtb not found"
          fi

      - name: Collect firmware images
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin/targets -name '*sysupgrade*.bin' -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.ubi'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.bin'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*initramfs*'    -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          echo "=== output ==="
          ls -la output/

      - name: Verify UBI image (Part 1)
        run: |
          set -e
          cd output

          UBI_FILE=$(find . -name '*prebuild*factory.ubi' | head -1)
          if [ -z "$UBI_FILE" ]; then
            UBI_FILE=$(find . -name '*factory.ubi' | head -1)
          fi
          if [ -z "$UBI_FILE" ]; then
            echo "ERROR: no factory.ubi found in output"
            ls -la
            exit 1
          fi

          echo "Checking: $UBI_FILE"
          SIZE=$(stat -c%s "$UBI_FILE")
          echo "Size: $SIZE bytes"

          if [ "$SIZE" -lt 4000000 ] || [ "$SIZE" -gt 20000000 ]; then
            echo "WARNING: size outside expected 4-20 MB range"
          fi

          MAGIC=$(xxd -p -l 4 "$UBI_FILE")
          echo "Magic bytes: $MAGIC"
          if [ "$MAGIC" != "55424923" ]; then
            echo "WARNING: does not start with 'UBI#' magic"
          else
            echo "OK: valid UBI# magic"
          fi

          if strings "$UBI_FILE" | grep -q "ipq5332-rd16"; then
            echo "OK: found ipq5332-rd16 DTB reference"
          else
            echo "WARNING: no ipq5332-rd16 DTB reference"
          fi

          if strings "$UBI_FILE" | grep -q "myhelper"; then
            echo "OK: found myhelper"
          else
            echo "WARNING: no myhelper in image"
          fi

          if strings "$UBI_FILE" | grep -q "xiaomi"; then
            echo "OK: found xiaomi references"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rd16-firmware-prebuild
          path: output/*
          if-no-files-found: error
          retention-days: 30
