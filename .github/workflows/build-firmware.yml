name: Build RD16 firmware (prebuild)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync subversion swig time unzip \
            zlib1g-dev file wget bc libelf-dev cpio aria2

      - name: Clone RomikB source
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-rd15 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          ls -la vendor_scripts/

      - name: Download stock firmware for kernel extraction
        run: |
          set -e
          cd openwrt-src
          # !!! ЗАМЕНИ URL НА СВОЮ ССЫЛКУ ИЗ RELEASE !!!
          STOCK_URL="https://github.com/serv4173-cloud/myhelper-openwrt/releases/download/stock-1.0.31/miwifi_rd16_firmware_87da2_1.0.31.bin"
          echo "Downloading stock firmware from $STOCK_URL"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o miwifi_rd16_firmware_87da2_1.0.31.bin "$STOCK_URL"
          ls -la miwifi_rd16_firmware_87da2_1.0.31.bin
          # Версия для совместимости с prepare_feed.sh (он ищет rd15)
          cp miwifi_rd16_firmware_87da2_1.0.31.bin miwifi_rd15_firmware_stub.bin || true

      - name: Copy myhelper into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Fix Makefile tabs
        run: |
          set -e
          FILE="openwrt-src/package/myhelper/Makefile"
          sed -i 's/^    /\t/' "$FILE"
          grep -nP '^\t' "$FILE" | head -10 | cat -A

      - name: Prepare feeds (extracts vendor kernel)
        run: |
          set -e
          cd openwrt-src
          echo "=== Running prepare_feed.sh ==="
          sh vendor_scripts/prepare_feed.sh
          echo "=== Checking extracted kernel ==="
          ls -la target/linux/ipq53xx/rd15/kernel 2>/dev/null || echo "NO rd15 kernel"
          ls -la target/linux/ipq53xx/rd16/kernel 2>/dev/null || echo "NO rd16 kernel"
          # Если rd16 kernel нет — копируем из rd15
          if [ ! -f target/linux/ipq53xx/rd16/kernel ] && [ -f target/linux/ipq53xx/rd15/kernel ]; then
            cp target/linux/ipq53xx/rd15/kernel target/linux/ipq53xx/rd16/kernel
            echo "Copied rd15 kernel to rd16"
          fi
          ls -la target/linux/ipq53xx/rd16/kernel

      - name: Prepare config for RD16 (prebuild)
        run: |
          set -e
          cd openwrt-src
          chmod +x vendor_scripts/*.sh vendor_scripts/*.py 2>/dev/null || true
          sh vendor_scripts/prepare_config.sh rd16

          # Оставляем ТОЛЬКО prebuild (убираем QSDK — он ломает сеть)
          sed -i '/TARGET_DEVICE_ipq53xx_rd16_DEVICE_xiaomi-rd16-qsdk/d' .config
          sed -i '/TARGET_DEVICE_ipq53xx_rd16_DEVICE_xiaomi-rd16-qsdk-podkop/d' .config

          make defconfig

          echo "=== Active devices ==="
          grep -E '^CONFIG_TARGET_DEVICE_ipq53xx_rd16' .config || echo "!!! NO DEVICES !!!"

      - name: Remove QSDK packages from target.mk
        run: |
          set -e
          cd openwrt-src
          TARGET_MK="target/linux/ipq53xx/rd16/target.mk"
          for pkg in \
            kmod-qca-nss-ecm-wifi-plugin kmod-qca-nss-ppe-lag-mgr \
            kmod-qca-nss-ppe-pppoe-mgr wififw_mount_script \
            qca-cfg80211tool-vendor qca-cnss-daemon-vendor \
            qca-firmware-vendor qca-hostap-vendor qca-hostapd-cli \
            qca-wpa-cli qca-wpa-supplicant-vendor qca-ssdk-shell \
            yt-9215s-client ; do
            sed -i "s|${pkg}||g" "$TARGET_MK"
          done
          grep -E "qca-|wififw" "$TARGET_MK" && echo "!!! still present !!!" || echo "OK: QSDK removed"

      - name: Prepare feeds install
        run: |
          set -e
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Enable myhelper + runtime deps
        run: |
          set -e
          cd openwrt-src
          echo "CONFIG_PACKAGE_myhelper=y"             >> .config
          echo "CONFIG_PACKAGE_nftables=y"            >> .config
          echo "CONFIG_PACKAGE_tc=y"                  >> .config
          echo "CONFIG_PACKAGE_ethtool=y"             >> .config
          echo "CONFIG_PACKAGE_kmod-sched-cake=y"     >> .config
          echo "CONFIG_PACKAGE_kmod-ifb=y"            >> .config
          echo "CONFIG_PACKAGE_kmod-nft-core=y"       >> .config
          echo "CONFIG_PACKAGE_kmod-tcp-bbr=y"        >> .config
          make defconfig
          grep -E '^CONFIG_PACKAGE_(myhelper|nftables|tc|kmod-sched-cake|kmod-ifb|kmod-tcp-bbr|kmod-nft-core)=' .config || true

      - name: Build kmod toolchain (GCC 7.5.0)
        run: |
          set -e
          cd openwrt-src
          bash vendor_scripts/build_kmod_toolchain.sh

      - name: Build full firmware
        run: |
          set -e
          cd openwrt-src
          make -j$(nproc) V=s || make -j1 V=s
      - name: Verify compiled kernel
        run: |
          set -e
          cd openwrt-src
    
          # Найти собранный kernel
          KERNEL=$(find build_dir -name 'Image' -path '*linux-ipq53xx*' | head -1)
          echo "Kernel: $KERNEL"
          ls -la "$KERNEL"
    
          # Найти DTB для RD16
          DTB=$(find build_dir -name 'ipq5332-rd16.dtb' | head -1)
          echo "DTB: $DTB"
          ls -la "$DTB"
    
          # Проверить, что DTB валидный
          if [ -f "$DTB" ]; then
            echo "DTB is valid binary"
            xxd "$DTB" | head -2
          fi
    
          # Проверить, что kernel несёт встроенные драйверы (grep по строкам)
          if strings "$KERNEL" | grep -q "ipq53"; then
            echo "OK: kernel contains ipq53 references"
          fi
          if strings "$KERNEL" | grep -q "qca-nss"; then
            echo "OK: kernel contains NSS references"
          fi
      - name: Collect firmware images
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin/targets -name '*sysupgrade*.bin' -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.ubi'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*factory*.bin'  -exec cp -v {} output/ \; || true
          find openwrt-src/bin/targets -name '*initramfs*'    -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          echo "=== output ==="
          ls -la output/
      - name: Verify firmware image
        run: |
          set -e
          cd output
    
          echo "=== Files ==="
          ls -la
    
          UBI_FILE=$(find . -name '*prebuild*factory.ubi' | head -1)
          if [ -z "$UBI_FILE" ]; then
            echo "ERROR: no factory.ubi found"
            exit 1
          fi
          echo "Checking: $UBI_FILE"
          echo "Size: $(stat -c%s $UBI_FILE) bytes"
    
          # Проверка размера (ожидаем 6-12 МБ)
          SIZE=$(stat -c%s "$UBI_FILE")
          if [ "$SIZE" -lt 4000000 ] || [ "$SIZE" -gt 20000000 ]; then
            echo "WARNING: size out of expected range (4-20 MB)"
          fi
    
          # Проверка что файл начинается с UBI magic (0x55424923 = "UBI#")
          MAGIC=$(xxd -p -l 4 "$UBI_FILE")
          echo "Magic bytes: $MAGIC"
          if [ "$MAGIC" != "55424923" ]; then
            echo "WARNING: file does not start with UBI# magic"
          else
            echo "OK: valid UBI magic"
          fi
    
          # Проверка наличия строки ipq5332-rd16.dtb внутри (DTB для нашей модели)
          if strings "$UBI_FILE" | grep -q "ipq5332-rd16"; then
            echo "OK: found ipq5332-rd16 DTB reference"
          else
            echo "WARNING: no ipq5332-rd16 DTB reference — Wi-Fi/LAN may not work"
          fi
    
          # Проверка наличия myhelper
          if strings "$UBI_FILE" | grep -q "myhelper"; then
            echo "OK: found myhelper"
          else
            echo "WARNING: no myhelper in image"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rd16-firmware-prebuild
          path: output/*
          if-no-files-found: error
          retention-days: 30
