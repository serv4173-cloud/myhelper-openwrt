name: Build myhelper package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK (ipq50xx)
        run: |
          set -e
          mkdir -p sdk
          cd sdk
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          BASE="https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq50xx/"
          curl --http1.1 -fsSL --max-time 60 -o index.html "$BASE"
          SDK_FILE=$(grep -o 'openwrt-sdk-qualcommax-ipq50xx[^"]*\.tar\.zst' index.html | head -n 1)
          aria2c -x 16 -s 16 -k 1M --max-tries=5 --retry-wait=5 \
                 --console-log-level=warn --summary-interval=30 \
                 -o "$SDK_FILE" "$BASE$SDK_FILE"
          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"

      - name: Fix Makefile tabs
        run: |
          set -e
          FILE="package/myhelper/Makefile"
          grep -nP '^[ \t]' "$FILE" | head -20 | cat -A || true
          sed -i 's/^    /\t/' "$FILE"
          grep -nP '^\t' "$FILE" | head -20 | cat -A || true

      - name: Copy package into SDK
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p "$SDK_DIR/package/myhelper"
          cp -r package/myhelper/* "$SDK_DIR/package/myhelper/"
          ls -la "$SDK_DIR/package/myhelper/"

      - name: Build package
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig
          echo "=== .config check ==="
          grep -E 'CONFIG_PACKAGE_myhelper' .config || echo "!!! myhelper NOT in .config !!!"
          make package/myhelper/compile V=s -j$(nproc)
          echo "=== All myhelper files inside SDK ==="
          find "$SDK_DIR/bin" -name 'myhelper*' -exec ls -la {} \; || true
          echo "=== All .apk files ==="
          find "$SDK_DIR/bin" -name '*.apk' -exec ls -la {} \; || true
          echo "=== All .ipk files ==="
          find "$SDK_DIR/bin" -name '*.ipk' -exec ls -la {} \; || true

      - name: Collect .ipk or .apk
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          mkdir -p output

          # Prefer .ipk (opkg) — grab it if present.
          find "$SDK_DIR/bin" -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true

          # Also grab .apk (new format used by snapshots).
          find "$SDK_DIR/bin" -name 'myhelper*.apk' -exec cp -v {} output/ \; || true

          echo "=== output/ contents ==="
          ls -la output/

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: output is empty — nothing collected"
            echo "=== Diagnostic: tree of bin/packages ==="
            find "$SDK_DIR/bin/packages" -maxdepth 4 -type f | head -50
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-package
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30
