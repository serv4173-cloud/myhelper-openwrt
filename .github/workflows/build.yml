name: Build myhelper package from RomikB source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync subversion swig time unzip \
            zlib1g-dev file wget aria2

      - name: Clone RomikB OpenWrt source
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-rd15 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          echo "=== Top-level contents ==="
          ls -la
          echo "=== Looking for pre-made configs ==="
          find . -maxdepth 3 -iname '*rd15*' -o -iname '*config*' 2>/dev/null | head -40

      - name: Inspect vendor_scripts and config folder
        run: |
          set -e
          cd openwrt-src
          echo "=== vendor_scripts ==="
          ls -la vendor_scripts/ 2>/dev/null || echo "no vendor_scripts"
          echo "=== config/ ==="
          ls -la config/ 2>/dev/null || echo "no config folder"
          echo "=== files in root matching rd15 ==="
          find . -maxdepth 2 -name '*rd15*' 2>/dev/null
          echo "=== check for pre-made .config ==="
          ls -la .config 2>/dev/null || echo "no .config in root"
          ls -la configs/ 2>/dev/null || echo "no configs folder"

      - name: Copy myhelper package into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Prepare feeds and config
        run: |
          set -e
          cd openwrt-src

          # Try to find and apply RomikB's prepared config
          CONFIG_APPLIED=0

          if [ -f .config ]; then
            echo "Found pre-existing .config in repo root"
            CONFIG_APPLIED=1
          elif [ -f config/rd15.config ]; then
            echo "Using config/rd15.config"
            cp config/rd15.config .config
            CONFIG_APPLIED=1
          elif [ -f configs/rd15.config ]; then
            echo "Using configs/rd15.config"
            cp configs/rd15.config .config
            CONFIG_APPLIED=1
          fi

          if [ "$CONFIG_APPLIED" = "0" ]; then
            echo "=== Searching for any RD15 config in repo ==="
            find . -maxdepth 4 -name '*.config' -o -name 'rd15*' 2>/dev/null | head -20
            echo "=== Running vendor prepare script if present ==="
            if [ -f vendor_scripts/prepare_config.sh ]; then
              chmod +x vendor_scripts/prepare_config.sh
              ./vendor_scripts/prepare_config.sh
              CONFIG_APPLIED=1
            fi
          fi

          if [ "$CONFIG_APPLIED" = "0" ]; then
            echo "ERROR: no RD15 config found — cannot continue"
            exit 1
          fi

          # Add our package on top
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig

          echo "=== Target check (must be aarch64/ipq53xx) ==="
          grep -E '^CONFIG_TARGET_(arch|subtarget|profile)' .config | head -10
          echo "=== myhelper in config? ==="
          grep -E 'CONFIG_PACKAGE_myhelper' .config || echo "!!! myhelper NOT in .config !!!"

      - name: Build myhelper package
        run: |
          set -e
          cd openwrt-src
          make package/myhelper/compile V=s -j$(nproc)
          echo "=== Look for myhelper artifacts ==="
          find bin -name 'myhelper*' -exec ls -la {} \; || true

      - name: Collect .ipk
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.apk' -exec cp -v {} output/ \; || true

          echo "=== output/ contents ==="
          ls -la output/

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: no myhelper package was produced."
            find openwrt-src/bin -maxdepth 4 -type f | head -60
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-package
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30
