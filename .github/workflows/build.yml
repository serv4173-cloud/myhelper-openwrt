name: Build myhelper package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK (ipq50xx)
        run: |
          set -e
          mkdir -p sdk
          cd sdk

          # aria2c is not on the runner by default.
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2

          BASE="https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq50xx/"

          echo "Fetching index..."
          curl --http1.1 -fsSL --max-time 60 -o index.html "$BASE"

          SDK_FILE=$(grep -o 'openwrt-sdk-qualcommax-ipq50xx[^"]*\.tar\.zst' index.html | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "SDK not found in index"
            exit 1
          fi
          echo "SDK file: $SDK_FILE"

          echo "Downloading with aria2c (16 parallel connections)..."
          aria2c -x 16 -s 16 -k 1M \
                 --max-tries=5 --retry-wait=5 \
                 --console-log-level=warn \
                 --summary-interval=30 \
                 -o "$SDK_FILE" \
                 "$BASE$SDK_FILE"

          echo "Downloaded:"
          ls -la "$SDK_FILE"

          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"
          echo "Extracted:"
          ls -la

      - name: Copy package into SDK
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p "$SDK_DIR/package/myhelper"
          cp -r package/myhelper/* "$SDK_DIR/package/myhelper/"
          ls -la "$SDK_DIR/package/myhelper/"

      - name: Build package
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig
          make package/myhelper/compile V=s -j$(nproc)

      - name: Collect .ipk
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          mkdir -p output
          find "$SDK_DIR/bin" -name 'myhelper*.ipk' -exec cp {} output/ \;
          ls -la output/

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-ipk
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
