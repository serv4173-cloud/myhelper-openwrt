name: Build myhelper package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK (ipq50xx)
        run: |
          set -e
          mkdir -p sdk
          cd sdk
          sudo apt-get update -qq
          sudo apt-get install -y -qq aria2
          BASE="https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq50xx/"
          curl --http1.1 -fsSL --max-time 60 -o index.html "$BASE"
          SDK_FILE=$(grep -o 'openwrt-sdk-qualcommax-ipq50xx[^"]*\.tar\.zst' index.html | head -n 1)
          aria2c -x 16 -s 16 -k 1M --max-tries=5 --retry-wait=5 \
                 --console-log-level=warn --summary-interval=30 \
                 -o "$SDK_FILE" "$BASE$SDK_FILE"
          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"

      - name: Fix Makefile tabs
        run: |
          set -e
          FILE="package/myhelper/Makefile"
          echo "=== BEFORE: lines with leading whitespace ==="
          grep -nP '^[ \t]' "$FILE" | head -20 | cat -A
          echo "=== Fixing: 4 spaces -> 1 tab ==="
          sed -i 's/^    /\t/' "$FILE"
          echo "=== AFTER: lines with leading tabs ==="
          grep -nP '^\t' "$FILE" | head -20 | cat -A
          echo "=== Check for remaining leading spaces ==="
          if grep -qP '^ ' "$FILE"; then
            echo "WARNING: still found leading spaces:"
            grep -nP '^ ' "$FILE" | head -10
          else
            echo "OK: no leading spaces remain"
          fi

      - name: Copy package into SDK
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p "$SDK_DIR/package/myhelper"
          cp -r package/myhelper/* "$SDK_DIR/package/myhelper/"
          ls -la "$SDK_DIR/package/myhelper/"

      - name: Build package
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig
          make package/myhelper/compile V=s -j$(nproc)

      - name: Collect .ipk
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          mkdir -p output
          find "$SDK_DIR/bin" -name 'myhelper*.ipk' -exec cp {} output/ \;
          ls -la output/

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-ipk
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
