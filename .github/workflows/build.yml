name: Build myhelper for Xiaomi BE3600 RD16

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync subversion swig time unzip \
            zlib1g-dev file wget bc libelf-dev

      - name: Clone RomikB OpenWrt source (branch openwrt-24-rd15)
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-rd15 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          ls -la

      - name: Copy myhelper into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Configure .config for ipq53xx/rd16
        run: |
          set -e
          cd openwrt-src
          rm -f .config

          cat > .config << 'EOF'
          CONFIG_TARGET_ipq53xx=y
          CONFIG_TARGET_ipq53xx_rd16=y
          CONFIG_PACKAGE_myhelper=y
          EOF

          make defconfig

          echo "=== Target check ==="
          grep -E '^CONFIG_TARGET_(arch|board|subtarget|profile)' .config | head -10
          grep -E '^CONFIG_TARGET_ipq53xx' .config | head -10
          echo "=== myhelper in config? ==="
          grep -E 'CONFIG_PACKAGE_myhelper' .config || echo "!!! not in config !!!"

      - name: Build host tools
        run: |
          set -e
          cd openwrt-src
          make tools/install V=s -j$(nproc)

      - name: Build toolchain
        run: |
          set -e
          cd openwrt-src
          make toolchain/install V=s -j$(nproc)

      - name: Build myhelper package
        run: |
          set -e
          cd openwrt-src
          make package/myhelper/compile V=s -j$(nproc)
          echo "=== myhelper artifacts ==="
          find bin -name 'myhelper*' -exec ls -la {} \; || true

      - name: Collect package
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.apk' -exec cp -v {} output/ \; || true
          ls -la output/
          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: empty output"
            find openwrt-src/bin -maxdepth 4 -type f | head -60
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-package
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30
