name: Build myhelper package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK for qualcommax/ipq53xx
        run: |
          set -e
          mkdir -p sdk
          cd sdk
          INDEX_URL="https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq53xx/"
          echo "Fetching index from $INDEX_URL"
          wget -q "$INDEX_URL" -O index.html
          SDK_FILE=$(grep -o 'openwrt-sdk-qualcommax-ipq53xx[^"]*\.tar\.zst' index.html | head -n 1)
          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: could not find SDK tarball in index"
            cat index.html | head -50
            exit 1
          fi
          echo "Downloading $SDK_FILE"
          wget -q "$INDEX_URL$SDK_FILE"
          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"
          ls -la

      - name: Copy package into SDK
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p "$SDK_DIR/package/myhelper"
          cp -r package/myhelper/* "$SDK_DIR/package/myhelper/"
          ls -la "$SDK_DIR/package/myhelper/"

      - name: Build package
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig
          make package/myhelper/compile V=s -j$(nproc)

      - name: Collect .ipk
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          mkdir -p output
          find "$SDK_DIR/bin" -name 'myhelper*.ipk' -exec cp {} output/ \;
          ls -la output/

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-ipk
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
