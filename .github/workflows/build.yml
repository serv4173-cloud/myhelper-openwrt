name: Build myhelper for Xiaomi BE3600 RD16

on:
  push:
    branches: [ main, fix/audit-bugfixes-2026-11 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pip python3-setuptools python3-venv rsync subversion swig time unzip \
            zlib1g-dev file wget bc libelf-dev cpio aria2

      - name: Install firmware extraction tools
        run: |
          set -e
          TOOL_VENV="$RUNNER_TEMP/firmware-tools"
          python3 -m venv "$TOOL_VENV"
          "$TOOL_VENV/bin/python" -m pip install --upgrade pip
          "$TOOL_VENV/bin/python" -m pip install ubi_reader pyelftools capstone
          echo "$TOOL_VENV/bin" >> "$GITHUB_PATH"
          "$TOOL_VENV/bin/ubireader_extract_images" --help >/dev/null
          echo "ubi_reader installed: $TOOL_VENV/bin/ubireader_extract_images"

      - name: Clone RomikB source (branch openwrt-24-be3600)
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-be3600 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          echo "=== Top-level ==="
          ls -la
          echo "=== vendor_scripts/ ==="
          ls -la vendor_scripts/
          echo "=== vendor_toolchain/ ==="
          ls -la vendor_toolchain/ 2>/dev/null || echo "no vendor_toolchain"

      - name: Download stock RD16 firmware
        run: |
          set -e
          cd openwrt-src
          STOCK_URL="https://github.com/serv4173-cloud/myhelper-openwrt/releases/download/stock-1.0.31/miwifi_rd16_firmware_87da2_1.0.31.bin"
          echo "Downloading stock RD16 firmware: $STOCK_URL"
          curl -fL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 600 \
            -o "miwifi_rd16_firmware_87da2_1.0.31.bin" "$STOCK_URL"
          test -s "miwifi_rd16_firmware_87da2_1.0.31.bin"
          echo "Downloaded firmware size: $(stat -c%s "miwifi_rd16_firmware_87da2_1.0.31.bin") bytes"

      - name: Copy myhelper into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Inject custom sysauth.ut overlay
        run: |
          set -e
          # Создаем структуру папок в исходниках OpenWrt
          mkdir -p openwrt-src/files/usr/share/ucode/luci/template/themes/argon
          
          # Копируем файл из корня вашего репозитория (files/) в исходники (openwrt-src/files/)
          cp files/usr/share/ucode/luci/template/themes/argon/sysauth.ut openwrt-src/files/usr/share/ucode/luci/template/themes/argon/sysauth.ut
          
          echo "=== Custom sysauth.ut overlay injected successfully ==="
          ls -la openwrt-src/files/usr/share/ucode/luci/template/themes/argon/

      - name: Prepare config for RD16
        run: |
          set -e
          cd openwrt-src
          chmod +x vendor_scripts/*.sh vendor_scripts/*.py 2>/dev/null || true
          echo "=== Running prepare_config.sh rd16 ==="
          sh vendor_scripts/prepare_config.sh rd16
          echo "=== .config after prepare_config ==="
          grep -E '^CONFIG_TARGET' .config | head -20

      - name: Prepare feeds
        run: |
          set -e
          cd openwrt-src
          FW_FILE="miwifi_rd16_firmware_87da2_1.0.31.bin"
          test -s "$FW_FILE" || { echo "ERROR: missing stock RD16 firmware: $FW_FILE"; exit 1; }
          echo "=== Running prepare_feed.sh for RD16 ==="
          sh vendor_scripts/prepare_feed.sh rd16 "$FW_FILE"
          echo "=== feeds.conf ==="
          if [ -f feeds.conf ]; then
            cat feeds.conf
          elif [ -f feeds.conf.default ]; then
            cat feeds.conf.default
          else
            echo "ERROR: prepare_feed.sh did not produce feeds.conf or feeds.conf.default"
            exit 1
          fi

      - name: Update feeds and enable myhelper
        run: |
          set -e
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # Enable our package (must be after prepare_config.sh, which wipes .config)
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig

          echo "=== Verify target ==="
          grep -E '^CONFIG_TARGET_arch=' .config || true
          grep -E '^CONFIG_TARGET_ipq53xx' .config | head -10
          grep -E '^CONFIG_TARGET_DEVICE' .config | head -5

          echo "=== Verify myhelper in config ==="
          grep -qx 'CONFIG_PACKAGE_myhelper=y' .config || {
            echo "ERROR: myhelper was not enabled after make defconfig"
            exit 1
          }
          grep -E '^CONFIG_TARGET_DEVICE_.*rd16.*=y$' .config || {
            echo "ERROR: no enabled RD16 device in .config"
            exit 1
          }

      - name: Build kernel module toolchain (GCC 7.5.0)
        run: |
          set -e
          cd openwrt-src
          echo "=== Running build_kmod_toolchain.sh ==="
          bash vendor_scripts/build_kmod_toolchain.sh

      - name: Build userspace toolchain (GCC 13.3.0)
        run: |
          set -e
          cd openwrt-src
          make toolchain/install V=s -j$(nproc)

      - name: Build target kernel and prepare kernel configuration
        run: |
          set -e
          cd openwrt-src
          # target/linux/prepare only unpacks and patches the kernel source;
          # it does not generate the target kernel .config. The toolchain's
          # linux-5.4.213/.config is a different config and must not be used.
          # Compile the target once so OpenWrt runs kernel_menuconfig/oldconfig
          # and produces the real target kernel config needed by kmod deps.
          echo "=== Build target Linux kernel and modules ==="
          make target/linux/compile V=s -j$(nproc)
          echo "=== Locate target kernel config (not toolchain config) ==="
          find build_dir -path '*/linux-ipq53xx_ipq53xx_32/linux-*/.config' -type f -print
          KERNEL_CONFIG="$(find build_dir -path '*/linux-ipq53xx_ipq53xx_32/linux-*/.config' -type f -print -quit)"
          if [ -z "$KERNEL_CONFIG" ]; then
            echo "ERROR: target/linux/compile did not create an IPQ53xx target kernel .config"
            echo "=== Relevant build directories ==="
            find build_dir -maxdepth 7 -type d -name 'linux-*' -print | head -100
            exit 1
          fi
          grep -q '^CONFIG_' "$KERNEL_CONFIG" || {
            echo "ERROR: target kernel .config exists but is empty/invalid: $KERNEL_CONFIG"
            exit 1
          }
          echo "Target kernel config prepared: $KERNEL_CONFIG"

      - name: Build myhelper package
        run: |
          set -e
          cd openwrt-src
          make package/myhelper/compile V=s -j$(nproc)
          echo "=== myhelper artifacts in bin/ ==="
          find bin -name 'myhelper*' -exec ls -la {} \; || true

      - name: Collect package
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.apk' -exec cp -v {} output/ \; || true
          echo "=== output contents ==="
          ls -la output/
          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: no myhelper package produced"
            echo "=== diagnostic: bin tree ==="
            find openwrt-src/bin -maxdepth 4 -type f | head -60
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-package
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30
