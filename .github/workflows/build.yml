name: Build myhelper package from RomikB source

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 hours max — full source build is long
    steps:
      - name: Checkout myhelper package
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync subversion swig time unzip \
            zlib1g-dev file wget rsync

      - name: Clone RomikB OpenWrt source
        run: |
          set -e
          git clone --depth 1 --branch openwrt-24-rd15 \
            https://github.com/RomikB/openwrt.git openwrt-src
          cd openwrt-src
          echo "=== Top-level contents ==="
          ls -la

      - name: Copy myhelper package into source tree
        run: |
          set -e
          mkdir -p openwrt-src/package/myhelper
          cp -r package/myhelper/* openwrt-src/package/myhelper/
          ls -la openwrt-src/package/myhelper/

      - name: Prepare feeds
        run: |
          set -e
          cd openwrt-src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build for RD15 target
        run: |
          set -e
          cd openwrt-src
          # Seed a minimal config so defconfig knows the target.
          # If prepare_config.sh exists, prefer it.
          if [ -f ./vendor_scripts/prepare_config.sh ]; then
            echo "Running vendor prepare_config.sh"
            ./vendor_scripts/prepare_config.sh || true
          fi

          # Force-enable our package in the config.
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig

          echo "=== Verify myhelper is in .config ==="
          grep -E 'CONFIG_PACKAGE_myhelper' .config || echo "!!! myhelper NOT in .config !!!"

      - name: Build myhelper package
        run: |
          set -e
          cd openwrt-src
          # Build only the package, not the entire firmware.
          # This is much faster than a full image build.
          make package/myhelper/compile V=s -j$(nproc)

          echo "=== Look for myhelper artifacts ==="
          find bin -name 'myhelper*' -exec ls -la {} \; || true

      - name: Collect .ipk
        run: |
          set -e
          mkdir -p output
          find openwrt-src/bin -name 'myhelper*.ipk' -exec cp -v {} output/ \; || true
          find openwrt-src/bin -name 'myhelper*.apk' -exec cp -v {} output/ \; || true

          echo "=== output/ contents ==="
          ls -la output/

          if [ -z "$(ls -A output)" ]; then
            echo "ERROR: no myhelper package was produced."
            echo "=== Diagnostic: bin/ tree ==="
            find openwrt-src/bin -maxdepth 4 -type f | head -60
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-package
          path: |
            output/*.ipk
            output/*.apk
          if-no-files-found: error
          retention-days: 30
