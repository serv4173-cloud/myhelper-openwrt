name: Build myhelper package

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenWrt SDK for qualcommax/ipq50xx
        run: |
          set -e
          mkdir -p sdk
          cd sdk

          MIRRORS="
            https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq50xx/
            https://mirror-03.infra.openwrt.org/snapshots/targets/qualcommax/ipq50xx/
            https://mirror-02.infra.openwrt.org/snapshots/targets/qualcommax/ipq50xx/
          "

          SDK_FILE=""
          INDEX_OK=""
          for M in $MIRRORS; do
            echo "Trying mirror: $M"
            if curl -fsSL --max-time 60 -o index.html "$M"; then
              SDK_FILE=$(grep -o 'openwrt-sdk-qualcommax-ipq50xx[^"]*\.tar\.zst' index.html | head -n 1)
              if [ -n "$SDK_FILE" ]; then
                INDEX_OK="$M"
                echo "Found SDK on $M -> $SDK_FILE"
                break
              fi
            fi
            echo "Mirror did not work, trying next..."
          done

          if [ -z "$SDK_FILE" ]; then
            echo "ERROR: could not find SDK tarball on any mirror"
            exit 1
          fi

          echo "Downloading $SDK_FILE from $INDEX_OK"
          curl -fL --retry 5 --retry-delay 5 --retry-connrefused \
               --connect-timeout 30 --max-time 1800 \
               -C - -o "$SDK_FILE" "$INDEX_OK$SDK_FILE"

          echo "Download done, size:"
          ls -la "$SDK_FILE"

          tar --zstd -xf "$SDK_FILE"
          rm -f "$SDK_FILE"
          ls -la

      - name: Copy package into SDK
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          echo "SDK_DIR=$SDK_DIR"
          mkdir -p "$SDK_DIR/package/myhelper"
          cp -r package/myhelper/* "$SDK_DIR/package/myhelper/"
          ls -la "$SDK_DIR/package/myhelper/"

      - name: Build package
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo "CONFIG_PACKAGE_myhelper=y" >> .config
          make defconfig
          make package/myhelper/compile V=s -j$(nproc)

      - name: Collect .ipk
        run: |
          set -e
          SDK_DIR=$(find sdk -maxdepth 1 -type d -name 'openwrt-sdk-*' | head -n 1)
          mkdir -p output
          find "$SDK_DIR/bin" -name 'myhelper*.ipk' -exec cp {} output/ \;
          ls -la output/

      - name: Upload .ipk artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: myhelper-ipk
          path: output/*.ipk
          if-no-files-found: error
          retention-days: 30
