name: PPE research static checks

on:
  push:
    branches:
      - ppe
    paths:
      - "scripts/ppe/**"
      - "docs/ppe/**"
      - ".github/workflows/ppe-static-checks.yml"
  pull_request:
    branches:
      - ppe
    paths:
      - "scripts/ppe/**"
      - "docs/ppe/**"
      - ".github/workflows/ppe-static-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ppe/collect-ppe-module-info.sh
          bash -n scripts/ppe/scan-ppe-sources.sh
          bash -n scripts/ppe/extract-stock-firmware.sh

      - name: Check argument validation
        shell: bash
        run: |
          set -euo pipefail
          set +e
          bash scripts/ppe/collect-ppe-module-info.sh >/tmp/module-help.txt 2>&1
          module_status=$?
          bash scripts/ppe/scan-ppe-sources.sh >/tmp/scan-help.txt 2>&1
          scan_status=$?
          bash scripts/ppe/extract-stock-firmware.sh >/tmp/extract-help.txt 2>&1
          extract_status=$?
          set -e
          test "$module_status" -eq 2
          test "$scan_status" -eq 2
          test "$extract_status" -eq 2
